<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fef7ff">
<title>حصص الإعاشة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Material+Symbols+Rounded" rel="stylesheet">
<style>
:root{--primary:#6750a4;--on:#1d1b20;--muted:#625b71;--surface:#fef7ff;--container:#f3edf7;--high:#e8def8;--line:#cac4d0;--error:#b3261e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans Arabic',Tahoma,sans-serif;color:var(--on);background:#e6e0e9}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #9a82d6;outline-offset:2px}.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga'} .stage{min-height:100dvh;display:grid;place-items:center;padding:16px}.app{width:412px;height:min(892px,calc(100dvh - 32px));background:var(--surface);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px #30264024}.top{height:68px;display:flex;align-items:center;padding:0 20px;gap:12px;flex:none}.top h1{font-size:20px;font-weight:600;margin:0;flex:1}.brand{width:40px;height:40px;border-radius:12px;background:var(--high);color:var(--primary);display:grid;place-items:center}.icon{width:48px;height:48px;background:transparent;color:var(--muted);border-radius:50%;display:grid;place-items:center}.icon:hover,.icon:active{background:#e8def8}.content{overflow:auto;overscroll-behavior:contain;padding:4px 16px 24px;flex:1;scrollbar-width:thin}.intro{padding:8px 4px 16px}.intro h2{font-size:26px;line-height:1.5;margin:0 0 4px;font-weight:700}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}.input-card{background:#eaddff;border-radius:20px;padding:18px 18px 16px}.input-title{display:flex;gap:10px;align-items:center;color:#381e72;font-weight:700;font-size:15px;margin-bottom:12px}.field{display:flex;background:#fff;border:1px solid #998bb5;border-radius:8px;align-items:center;min-height:58px;overflow:hidden}.field:focus-within{outline:2px solid var(--primary);border-color:var(--primary)}.field input{min-width:0;width:100%;border:0;outline:0;background:transparent;padding:10px 14px;color:#21182e;font-size:22px;font-weight:700;direction:ltr;text-align:right}.field span{padding:0 14px;color:var(--muted);white-space:nowrap;font-size:13px}.help{margin:9px 2px 0;color:#514567;font-size:12px;line-height:1.8}.error{color:var(--error);min-height:0;font-size:12px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 4px 12px}.section-head h2{font-size:18px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:4px 0 0}.count{font-size:12px;color:var(--primary);white-space:nowrap}.filters{display:flex;gap:8px;overflow:auto;padding:0 2px 12px}.chip{height:36px;padding:0 14px;border-radius:9px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;color:#49454f;font-size:12px}.chip[aria-pressed=true]{background:var(--high);box-shadow:none;color:#1d192b;font-weight:700}.table-wrap{overflow:auto;border:1px solid #ded8e2;border-radius:12px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:360px;text-align:right;font-size:12px}.table th{background:#f3edf7;color:#514b59;font-weight:600;padding:12px 10px;white-space:nowrap}.table td{padding:12px 10px;border-top:1px solid #eee9f0;vertical-align:middle}.table tbody tr:nth-child(even){background:#fdfbff}.item{font-weight:700;font-size:13px;white-space:nowrap}.sub{display:block;color:#77707d;font-size:11px;font-weight:400;margin-top:2px}.number{font-variant-numeric:tabular-nums;white-space:nowrap;color:#40277e;font-weight:700}.unit{font-weight:400;color:var(--muted)}.note{display:flex;align-items:flex-start;gap:10px;background:#f3edf7;border-radius:12px;padding:14px;margin:14px 0;color:#514b59;font-size:12px;line-height:1.9}.note .ms{font-size:20px;color:var(--primary)}.bottom{flex:none;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid #eee8f0}.primary{height:50px;width:100%;border-radius:100px;background:var(--primary);color:white;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}.primary:disabled{background:#ded8e2;color:#8c8591;cursor:not-allowed}.primary:not(:disabled):active{background:#503a89}.icon[hidden],.bottom[hidden]{display:none}.info{display:none}.info.active{display:block}.home.hidden{display:none}.info h2{font-size:24px}.info p,.info li{color:#514b59;line-height:2;font-size:14px}.info ul{padding-right:20px}.back{display:none}.back.show{display:grid}.print-head,.print-foot{display:none}@media(max-width:520px){.stage{display:block;padding:0}.app{width:100%;height:100dvh;border-radius:0;box-shadow:none}.content{padding-bottom:24px}}@media print{@page{size:A4;margin:12mm}html,body{background:white}.stage{display:block;padding:0}.app{display:block;width:auto;height:auto;overflow:visible;box-shadow:none;border-radius:0}.top,.intro,.input-card,.filters,.bottom,.note,.info,.section-head .count{display:none!important}.content{overflow:visible;padding:0}.home.hidden{display:block}.print-head,.print-foot{display:block}.print-head{border-bottom:2px solid #6750a4;padding-bottom:10px;margin-bottom:14px}.print-head h1{font-size:21pt;margin:0;color:#38236f}.print-head p{font-size:10pt;margin:4px 0}.section-head{margin:0 0 8px}.section-head h2{font-size:13pt}.section-head p{display:none}.table-wrap{overflow:visible;border:0}.table{min-width:0;font-size:9pt}.table th,.table td{padding:5px 8px;border:1px solid #ddd}.table thead{display:table-header-group}.table tr{break-inside:avoid}.table tr[hidden]{display:none!important}.table th{background:#eee8f7!important;print-color-adjust:exact}.print-foot{font-size:9pt;color:#514b59;margin-top:12px}.sub{font-size:8pt}}

/* Material 3 surfaces and compact print layout */
@media screen {
:root{--primary:#6750a4;--surface:#fef7ff;--muted:#625b71}
.app{border-radius:28px}.top{height:64px;padding:0 16px;gap:12px}.top h1{font-size:20px;font-weight:600}.brand{width:40px;height:40px;border-radius:50%;background:#eaddff}.content{padding:4px 16px 24px}.intro{padding:12px 4px 20px}.intro h2{font-size:27px;line-height:1.5;margin:0 0 3px}.intro p{font-size:13px;line-height:1.8}.input-card{background:#eaddff;border-radius:24px;padding:20px}.input-title{gap:12px;margin-bottom:16px}.input-icon{width:44px;height:44px;border-radius:16px;background:#d0bcff;display:grid;place-items:center;color:#381e72;flex:none}.input-title label{display:block;font-size:16px;line-height:1.5}.input-title small{display:block;font-size:12px;font-weight:400;color:#514567;line-height:1.7}.field{min-height:64px;background:#fffbff;border-color:#79747e;border-radius:8px}.field input{font-size:24px;font-weight:600}.field span{font-size:13px}.help{margin-top:8px}.section-head{margin:24px 4px 14px}.section-head h2{font-size:19px}.count{border-radius:100px;background:#f0e8fa;padding:4px 10px}.filters{gap:8px;padding-bottom:14px}.chip{height:40px;padding:0 15px;border-radius:10px;font-size:13px}.table-wrap{border-color:#e3dce8;border-radius:16px}.table th{background:#f3edf7;padding:12px 10px}.table td{padding:14px 10px}.table tbody tr:nth-child(even){background:#faf7fc}.item{font-size:13px}.number{color:#543a91}.bottom{padding:12px 16px max(16px,env(safe-area-inset-bottom));background:#f7f2fa;border:0}.primary{height:52px;font-size:14px;box-shadow:0 1px 2px #0002}.primary:not(:disabled):hover{background:#5b4499}.info h2{font-size:26px}.info ul{padding-right:24px}@media(max-width:520px){.app{border-radius:0}}
}
@media print {
@page{size:A4;margin:10mm 12mm}
.print-head{border-bottom:1.5pt solid #6750a4;padding-bottom:4mm;margin-bottom:4mm}.print-head h1{font-size:17pt;line-height:1.35}.print-head p{font-size:9pt;line-height:1.3;margin:2mm 0 0}.section-head{margin:0 0 2mm}.section-head h2{font-size:11pt;line-height:1.3}.table{font-size:8.5pt;line-height:1.25;table-layout:fixed}.table th,.table td{padding:1.6mm 2.5mm;border:0;border-bottom:0.5pt solid #e2dce6;line-height:1.3}.table th{font-size:8.5pt;background:#ede7f4!important;color:#40374d}.table th:first-child{width:36%}.table th:nth-child(2){width:17%}.table th:nth-child(3){width:20%}.table th:nth-child(4){width:27%}.table td.item{font-size:8.5pt;white-space:normal}.sub{display:inline;font-size:7pt;margin:0 3mm 0 0;color:#716c77;font-weight:400}.table tbody tr:nth-child(even){background:#faf8fc!important;print-color-adjust:exact}.table tr[hidden]{display:none!important}.print-foot,.note{display:none!important}
}
@media print {
  .content { padding: 0 5mm; }
  .print-head, .section-head, .table-wrap { width: 100%; }
  .print-head h1 { font-size: 16pt; line-height: 1.6; }
  .print-head p { line-height: 1.6; }
  .section-head h2 { line-height: 1.6; }
  .table { line-height: 1.6; }
  .table th, .table td { line-height: 1.6; padding: 0.8mm 2.5mm; }
  .table td.item { line-height: 1.6; }
  .sub { line-height: inherit; }
}
/* Separate Arabic shaping runs for the name and its accompanying label. */
.material-name { display: inline-block; direction: rtl; unicode-bidi: isolate; }
@media print { .sub { display: inline-block; direction: rtl; unicode-bidi: isolate; } }
.month-days{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px;color:#514567}.month-days select{font:inherit;min-height:48px;min-width:72px;border:1px solid #79747e;border-radius:8px;background:#fffbff;color:#381e72;padding:0 12px}.monthly-result{display:block;font-size:11px;font-weight:400;color:#625b71;margin-top:4px}.quantity-label{font-size:10px;font-weight:400;color:#625b71}@media print{.monthly-result{font-size:7pt;line-height:1.5;margin-top:0}.quantity-label{font-size:7pt}.table th,.table td{padding-top:.4mm;padding-bottom:.4mm}}
.amount-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px;font-size:11px;color:#625b71}.amount-tools button{background:#e8def8;color:#381e72;border-radius:100px;padding:8px 12px;min-height:48px;font-size:11px}.amount-input{font:inherit;width:66px;min-height:48px;border:1px solid #79747e;border-radius:6px;padding:4px;background:#fffbff;color:#381e72;direction:ltr;text-align:center}.amount-input:invalid{border-color:#b3261e}.print-amount{display:none}@media print{.amount-tools,.amount-input{display:none!important}.print-amount{display:inline}}
</style></head>
<body><div class="stage"><div class="app">
<header class="top"><div class="brand"><span class="ms">restaurant_menu</span></div><h1>حصص الإعاشة</h1></header>
<main class="content"><section class="home" id="home"><div class="print-head"><h1>كشف حصص الإعاشة</h1><p id="printMeta"></p></div>
<div class="intro"><h2>احسب احتياج الأفراد</h2></div>
<div class="input-card"><div class="input-title"><span class="input-icon"><span class="ms">group</span></span><div><label for="people">عدد الأشخاص</label><small>حساب الكميات حسب العدد</small></div></div><div class="field"><input id="people" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-describedby="error"><span>شخص</span></div><div class="error" id="error" role="alert"></div><label class="month-days" for="days">أيام الحساب الشهري<select id="days"><option>28</option><option>29</option><option selected>30</option><option>31</option></select></label></div>
<div class="section-head"><div><h2>جدول المواد</h2><p>الكميات بحسب الفترة المحددة لكل مادة</p></div><span class="count" id="count">٢٣ مادة</span></div>
<div class="filters" role="group" aria-label="تصفية الجدول"><button class="chip" data-filter="all" aria-pressed="true">الكل</button><button class="chip" data-filter="يومياً" aria-pressed="false">يومي</button><button class="chip" data-filter="كل وجبة" aria-pressed="false">كل وجبة</button><button class="chip" data-filter="شهرياً" aria-pressed="false">شهري</button></div>
<div class="amount-tools"><span>يمكن تعديل الحصة لكل مادة</span><button id="resetAmounts" type="button">استعادة المقادير الأصلية</button></div><div class="table-wrap"><table class="table"><thead><tr><th>المادة</th><th>الفترة</th><th>الحصة</th><th>الكمية المطلوبة</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<footer class="bottom" id="bottom"><button class="primary" id="export" disabled><span class="ms">picture_as_pdf</span>حفظ الكشف بصيغة PDF</button></footer></div></div>
<script>
const items=[['تمن','يومياً',175,'غرام'],['فاصوليا','كل وجبة',80,'غرام'],['معجون','يومياً',50,'غرام'],['زيت','يومياً',28,'سي سي'],['شعرية','كل وجبة',30,'غرام'],['حمص مجروش','كل وجبة',80,'غرام','وجبة رئيسية'],['حمص مجروش','كل وجبة',30,'غرام','مع شجر'],['سكر','يومياً',67,'غرام'],['شاي','يومياً',10,'غرام'],['طحين أسمر','يومياً',286,'غرام'],['طحين صفر','يومياً',143,'غرام'],['ماء','يومياً',7,'بطل'],['زيت أرزاق','يومياً',33,'سي سي'],['ملح','يومياً',24,'غرام'],['تايت','يومياً',10,'غرام'],['صابون','شهرياً',4,'قطعة'],['خمرة','شهرياً',16,'باكيت','',true],['بهارات قدر','شهرياً',2,'كيلو','',true],['كركم أصفر','شهرياً',4,'كيلو','',true],['نومي بصرة','شهرياً',4,'كيلو','',true],['زاهي','شهرياً',4,'كارتون','',true],['جلافات','شهرياً',20,'درزن','',true],['علاقة بلاستك','شهرياً',24,'درزن','',true]];
const originalAmounts=items.map(item=>item[2]);
const $=id=>document.getElementById(id), input=$('people'), rows=$('rows'), exp=$('export'); let filter='all';
function normalize(s){return s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).trim()}
function value(){let s=normalize(input.value);return /^\d+$/.test(s)&&Number(s)>0&&Number(s)<=1000000?Number(s):null}
const format=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:3}).format(n);
function displayQuantity(amount,unit){if(unit==='غرام'&&amount>=1000)return {amount:amount/1000,unit:'كيلوغرام'};if(unit==='سي سي'&&amount>=1000)return {amount:amount/1000,unit:'لتر'};return {amount,unit:unit==='كيلو'?'كيلوغرام':unit};}
function matches(period){return filter==='all'||filter===period||(filter==='شهرياً'&&period==='يومياً')}
function quantityHTML(amount,unit){const q=displayQuantity(amount,unit);return format(q.amount)+' <span class="unit">'+q.unit+'</span>'}
function render(){
 const n=value(), raw=input.value.trim(), days=Number($('days').value);
 $('error').textContent=raw&&!n?'أدخل عدداً صحيحاً بين ١ و١٬٠٠٠٬٠٠٠.':'';
 input.setAttribute('aria-invalid',raw&&!n?'true':'false');exp.disabled=!n;
 rows.innerHTML=items.map(([name,period,amount,unit,note,group],index)=>{
  const daily=period==='يومياً', monthlyView=filter==='شهرياً';
  let result='—';
  if(n){const total=group?amount:amount*n;
   if(daily&&monthlyView)result=quantityHTML(total*days,unit);
   else if(daily)result='<span class="quantity-label">يومي: </span>'+quantityHTML(total,unit)+'<span class="monthly-result">شهري: '+quantityHTML(total*days,unit)+'</span>';
   else result=quantityHTML(total,unit);
  }
  return `<tr ${matches(period)?'':'hidden'}><td class="item"><span class="material-name">${name}</span> <span class="sub">${note||(group?'لكل فوج':'لكل شخص')}</span></td><td>${daily&&monthlyView?'شهرياً':period}</td><td><input class="amount-input" type="number" inputmode="decimal" min="0.001" max="1000000" step="0.001" required data-index="${index}" value="${amount}" aria-label="حصة ${name}${note?'، '+note:''}، ${unit}"><span class="print-amount">${format(amount)}</span> ${unit}${daily&&monthlyView?'<span class="sub">يومياً</span>':''}</td><td class="number">${result}</td></tr>`;
 }).join('');
 $('count').textContent=format(items.filter(x=>matches(x[1])).length)+' مادة';
 $('printMeta').textContent='عدد الأشخاص: '+(n?format(n):'—')+' | الشهر: '+format(days)+' يوماً | تاريخ الإصدار: '+new Intl.DateTimeFormat('ar-IQ',{year:'numeric',month:'long',day:'numeric'}).format(new Date());
}
$('days').addEventListener('change',render);
rows.addEventListener('change',event=>{
 const field=event.target;
 if(!field.matches('.amount-input'))return;
 if(!field.checkValidity()){field.reportValidity();field.value=items[Number(field.dataset.index)][2];return;}
 items[Number(field.dataset.index)][2]=Number(field.value);render();
});
$('resetAmounts').addEventListener('click',()=>{items.forEach((item,index)=>item[2]=originalAmounts[index]);render()});
input.addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));exp.addEventListener('click',()=>{if(value())window.print()});
history.replaceState({page:'home'},'');history.pushState({page:'home'},'');window.addEventListener('popstate',()=>history.pushState({page:'home'},''));render();
</script></body></html>
